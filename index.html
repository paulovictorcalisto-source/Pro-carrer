<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro Career</title>
<style>
:root{--bg:#0e1410;--p:#18211b;--p2:#222e26;--g:#b8f34a;--m:#a2afa5;--w:#f4f7f3;--r:#ff6b62;--gt:#16200c;--b:rgba(255,255,255,.09);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;background:radial-gradient(ellipse at 80% 0,color-mix(in srgb,var(--g) 18%,transparent),transparent 40%),var(--bg);color:var(--w);font:15px Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
.app{max-width:820px;margin:auto;padding:14px 14px 96px}
.top{display:flex;align-items:center;gap:10px}.top h1{margin:0;font-size:16px}.top .gr{flex:1}
.m{color:var(--m)}small{font-size:12px}.g{color:var(--g)}.rd{color:var(--r)}
.pill{border:1px solid var(--b);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--m);white-space:nowrap}
.card{background:rgba(24,33,27,.95);border:1px solid var(--b);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 12px;font-size:14px;letter-spacing:.3px}
.hero{display:flex;gap:14px;align-items:center}.hero h2{margin:0;font-size:20px}
.ovr{margin-left:auto;text-align:center}.ovr b{display:block;font-size:32px;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:var(--p2);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:19px;margin-top:3px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;background:var(--p2);border-radius:14px;padding:16px 8px}
.match>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer;background:#2c3a30;color:var(--w)}
.btn.pr{background:var(--g);color:var(--gt)}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row>*{flex:1}
.bar{height:7px;background:#303a33;border-radius:6px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--g)}
.at{margin:10px 0;font-size:13px}.at div:first-child{display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 3px;text-align:center}th{color:var(--m);font-weight:400;font-size:11px}
td:nth-child(2),th:nth-child(2){text-align:left}tr{border-bottom:1px solid var(--b)}
td .t{display:flex;align-items:center;gap:7px}
tr.me{background:color-mix(in srgb,var(--g) 13%,transparent)}tr.eu td:first-child{box-shadow:inset 3px 0 var(--g)}tr.rel td:first-child{box-shadow:inset 3px 0 var(--r)}
.ev{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--b);font-size:13px}.ev:last-child{border:0}
.ev small{display:block;margin-top:3px;color:var(--m)}
.offer{background:var(--p2);border-radius:12px;padding:12px;margin-bottom:8px}.offer .t{display:flex;gap:10px;align-items:center}
.sub{display:flex;gap:6px;margin-bottom:4px;overflow-x:auto}
.sp{background:var(--p);border:1px solid var(--b);color:var(--m);border-radius:20px;padding:8px 14px;white-space:nowrap;cursor:pointer}.sp.on{background:var(--g);color:var(--gt);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:#121a15;border-top:1px solid var(--b);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav button{flex:1;background:none;border:0;color:var(--m);padding:6px 1px;font-size:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;border-radius:10px;position:relative}
nav button span{font-size:20px}nav button.on{color:var(--g);background:var(--p2)}
nav i{position:absolute;top:2px;right:18%;background:var(--r);color:#fff;border-radius:9px;font-size:10px;font-style:normal;padding:1px 5px}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;padding:16px;z-index:9}
.md{width:min(460px,100%);max-height:88vh;overflow:auto;background:#18211b;border:1px solid var(--b);border-radius:18px;padding:20px}
.md h2{margin:0 0 8px}.live{min-height:140px;font-size:14px}.live div{padding:5px 0;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.score{font-size:26px;text-align:center;margin:8px 0;font-weight:700}
input,select{width:100%;padding:11px;margin:5px 0 10px;background:#0e1410;color:var(--w);border:1px solid var(--b);border-radius:9px}
label{font-size:12px;color:var(--m)}.lg{font-size:12px;padding:3px 0;color:var(--m)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}

.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pg.n3{grid-template-columns:repeat(3,1fr)}
.pc{background:var(--p2);border:1px solid var(--b);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.pc span{font-size:26px}.pc.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,transparent)}.pc.sm{padding:8px 4px}.pc.sm span{font-size:28px}
/* Splash & Auth */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.splash .logo{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
.splash .logo span{color:var(--g)}
.splash .tag{color:var(--m);font-size:14px;margin-bottom:32px}
.splash .menu{width:min(320px,100%);display:flex;flex-direction:column;gap:10px}
.auth-box{width:min(340px,100%);text-align:left}
.auth-box h2{text-align:center;margin-bottom:16px}
.err{color:var(--r);font-size:13px;margin-top:6px;text-align:center}
.user-bar{font-size:12px;color:var(--m);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.audio-btn{position:fixed;bottom:70px;right:14px;z-index:6;background:var(--p);border:1px solid var(--b);border-radius:20px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--m)}
</style>
</head>

function doRegister(){
  const u = $("user").value.trim().toLowerCase();
  const p = $("pass").value;
  const p2 = $("pass2").value;
  const err = $("err");
  if(u.length<3){ err.textContent="Usuário precisa ter pelo menos 3 caracteres."; return; }
  if(p.length<4){ err.textContent="Senha precisa ter pelo menos 4 caracteres."; return; }
  if(p!==p2){ err.textContent="As senhas não coincidem."; return; }
  const users = getUsers();
  if(users[u]){ err.textContent="Este usuário já existe."; return; }
  users[u] = {pass:p, created:Date.now()};
  saveUsers(users);
  currentUser = u;
  afterLogin();
}

function doLogin(){
  const u = $("user").value.trim().toLowerCase();
  const p = $("pass").value;
  const err = $("err");
  const users = getUsers();
  if(!users[u] || users[u].pass !== p){ err.textContent="Usuário ou senha incorretos."; return; }
  currentUser = u;
  afterLogin();
}

function afterLogin(){
  
  S = loadCareer();
  if(S){
    // continue existing career
    tab="home";
    renderGame();
  } else {
    // new career
    startCreate();
  }
}

  if(S) saveCareer();
  S=null; currentUser=null;

}

 if(n.nodeType===3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}

function applyTheme(){let c=cfg.theme==="club"&&S?kc(S.club)[0]:cfg.theme;if(!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c))c="#b8f34a";

function narr(t){if(!cfg.narr||!window.speechSynthesis)return;try{const l=cfg.narr,g=/GOLO de|GOL de|GOAL/i.test(t);
 let x=tr(t.replace(/(\d+)'/g,(m,n)=>n+({pt:" minutos. ",en:" minutes. ",es:" minutos. "})[l]),l).replace(/[^\p{L}\p{N}\s.,!?:\-]/gu," ").replace(/\s+/g," ").trim();if(!x)return;

 const u=new SpeechSynthesisUtterance(x),v=bv(l);u.lang=NV[l];u.rate=g?1.15:1.05;u.pitch=g?1.25:1;u.volume=Math.min(1,cfg.vol*1.6+.2);if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}

const MT=[{n:"Aurora",r:60,sc:[0,2,4,5,7,9,11],b:76,w:"sine",p:[0,4,5,3]},{n:"Vestiário",r:57,sc:[0,2,3,5,7,8,10],b:70,w:"triangle",p:[0,5,2,6]},{n:"Estádio",r:62,sc:[0,2,4,5,7,9,11],b:96,w:"triangle",p:[0,3,4,0]},{n:"Noite de Jogo",r:55,sc:[0,2,3,5,7,9,10],b:66,w:"sine",p:[0,3,6,4]},{n:"Campo Aberto",r:64,sc:[0,2,4,7,9],b:88,w:"sine",p:[0,2,3,1]},{n:"Derby",r:59,sc:[0,2,3,5,7,8,11],b:104,w:"triangle",p:[0,5,6,4]},{n:"Final",r:58,sc:[0,2,4,5,7,9,11],b:92,w:"triangle",p:[0,4,5,3]},{n:"Madrugada",r:53,sc:[0,3,5,7,10],b:60,w:"sine",p:[0,3,2,4]}];

function mbar(){if(!mus.on)return;const T=MT[mus.i%MT.length],bt=60/(T.b+20),t=AC.currentTime+.05,d=T.p[mus.b%T.p.length];
